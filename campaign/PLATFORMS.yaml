schema_version: 1
last_updated: "2026-09-28"

# Role taxonomy:
# entity_profile       = public brand identity / citation / navigation
# publishing           = original/adapted public content
# social               = ongoing public social presence
# visual               = visual discovery / portfolio
# rss_distribution     = feed discovery / subscription / aggregation
# curation             = public curation when genuinely useful
# community            = participation governed by community rules
# utility              = operational tool, not an SEO backlink target
# automation           = workflow automation
# crowdfunding         = use only for a real campaign
# education_marketplace= use only for a real course/instructor purpose
# research_needed      = platform/domain/current suitability must be verified

# Automation modes:
# candidate            = may proceed after preflight verification
# audit_existing       = find/verify existing official account; do not create duplicate
# manual_plan_required = do not auto-create/publish until a human-approved use case exists
# skip_for_seo         = do not create for backlink purposes
# research_first       = verify exact platform/current status before any account action

waves:
  wave_1:
    objective: "High-signal entity, publishing, social and feed presence"
    platform_ids:
      - gravatar
      - bluesky
      - about_me
      - medium
      - substack
      - blogger
      - google_sites
      - feedly
      - inoreader
      - linktree

  wave_2:
    objective: "Additional legitimate publishing/distribution/curation after Wave 1 audit"
    platform_ids:
      - wordpress_com
      - tumblr
      - flipboard
      - follow_it
      - newsblur
      - feedspot
      - feeder
      - the_old_reader
      - lnk_bio
      - start_me
      - pearltrees

  wave_3:
    objective: "Creative/specialized presence only when matching assets/use cases exist"
    platform_ids:
      - behance
      - fivehundredpx
      - soundcloud
      - weebly
      - strikingly
      - postach
      - protopage
      - alltop
      - bloglovin

  wave_4:
    objective: "Community, utility and ambiguous platforms; no backlink automation"
    platform_ids:
      - reddit
      - disqus
      - diigo
      - instapaper
      - raindrop
      - bitly
      - evernote
      - onenote
      - nimbusnote
      - toodledo
      - trello
      - dropbox
      - ifttt
      - skillshare
      - kickstarter
      - ted
      - writexo
      - all4webs
      - justpast_it

