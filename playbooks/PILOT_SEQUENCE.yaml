schema_version: 2
last_updated: "2026-09-30"

purpose: >-
  Current execution order for NHÀ MỸ CALI browser-assisted web-presence work.
  Routine reversible UI work should be autonomous. Hard security/authorization
  controls remain human checkpoints.

global_gates:
  required_reading:
    - "AGENTS.md"
    - "brand/BRAND_ENTITY.yaml"
    - "brand/OFFICIAL_LINKS.yaml"
    - "brand/COPY_LIBRARY.md"
    - "assets/ASSET_MANIFEST.yaml"
    - "assets/PLATFORM_ASSET_POLICY.yaml"
    - "docs/REGISTRATION_POLICY.md"
    - "research/WAVE_1_DECISIONS.yaml"
  runtime_secrets_required:
    - "REGISTRATION_EMAIL"
    - "DEFAULT_ACCOUNT_PASSWORD"
  optional_runtime_secrets:
    - "SMS_PHONE_PRIMARY"
    - "SMS_PHONE_FALLBACK"
  autonomous_routine_actions:
    - "ordinary navigation and form buttons"
    - "standard free signup terms/privacy/community/publisher agreement acceptance"
    - "profile/About copy adaptation within canonical facts"
    - "approved asset upload"
    - "reasonable non-sensitive category/default selection"
    - "save/edit/publish actions explicitly authorized by a playbook"
    - "public QA"
    - "state/report update and commit"
  retry_policy: >-
    Retry an ordinary unresponsive UI action up to 3 times, including reload or
    direct navigation to the official page. If browser tooling still cannot activate
    a normal control, ask the owner for one manual click and resume from the resulting
    page without restarting the workflow.
  hard_stop_on:
    - "CAPTCHA or anti-bot challenge requiring human interaction"
    - "OTP/2FA/email/SMS security code or security challenge the browser cannot legitimately complete"
    - "identity or business document request"
    - "payment/subscription/Stripe/card/bank authorization"
    - "existing account with uncertain ownership"
    - "Terms/policy conflict that expressly prohibits the intended workflow or requires a non-routine legal/commercial commitment outside the standing owner authorization"
    - "material factual claim unsupported by canonical data"
    - "destructive irreversible action such as account deletion"

completed:
  - platform_id: "bluesky"
    completed_date: "2026-09-30"
    public_url: "https://bsky.app/profile/nhamycali.bsky.social"
    result: "Public profile verified, email verified, canonical website visible, seed post 1 published, no DNS changes."

  - platform_id: "substack"
    completed_date: "2026-09-30"
    public_url: "https://nhamycali.substack.com/"
    author_profile: "https://substack.com/@helenhanguyen"
    result: "Publication verified with canonical website and one welcome issue; owner finalized brand subdomain; no paid features, Stripe, custom domain, or DNS."

sequence:

  - order: 1
    platform_id: "blogger"
    playbook: "playbooks/BLOGGER.md"
    mode: "autonomous_routine_browser"
    goal: "Create a distinct educational supporting blog if absent."
    post_step_gate: "Run only after Substack audit."

  - order: 2
    platform_id: "gravatar"
    playbook: "playbooks/GRAVATAR_AUDIT.md"
    mode: "audit_existing"
    goal: "Confirm ownership/access and canonical link on existing Helen profile."
    post_step_gate: "No new Gravatar account."

  - order: 3
    platform_id: "linktree"
    playbook: "playbooks/LINKTREE_AUDIT.md"
    mode: "manual_audit"
    goal: "Review existing official Linktree."
    post_step_gate: "No automated account recreation."

  - order: 4
    platform_id: "medium"
    playbook: "playbooks/MEDIUM_MANUAL.md"
    mode: "manual_only"
    goal: "Prepare materials; human performs any Medium account/publication actions."
    post_step_gate: "Never automate signup/posting under current Medium Rules."

excluded_from_pilot:
  - "pinterest"
  - "about_me"
  - "feedly"
  - "inoreader"

deferred:
  google_sites:
    reason: "Requires an approved distinct resource-hub/event concept."

completion_definition:
  - "Every created profile/publication is publicly verified."
  - "No known duplicate official identity was created."
  - "Canonical website is present where appropriate."
  - "Approved assets are used correctly."
  - "No private credential/verification data is committed."
  - "state/accounts.csv is updated after every platform."
  - "A platform report is created or updated."
